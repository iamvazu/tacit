services:
  tacit-web:
    container_name: tacit-web
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_PORT_BIND:-127.0.0.1:3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/tacit.db
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-hello@tacit.exchange}
      - NOTIFY_EMAIL=${NOTIFY_EMAIL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://tacit.exchange}
    volumes:
      - ./data:/app/data
    networks:
      - tacit_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  tacit_net:
    driver: bridge
